name: Build and deploy to Azure Container Apps

# Runs on every push to main, plus on-demand via the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for OIDC federated login to Azure — no client secret stored in GitHub.
permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-saathiapp-dev
  CONTAINER_APP_NAME: ca-brdagent
  ACR_NAME: saathiappacrdev
  IMAGE_NAME: brd-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Deploy new revision to Container Apps
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Print app URL
        run: |
          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv
